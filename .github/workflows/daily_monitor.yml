name: Daily Monitor

on:
  schedule:
    - cron: '0 7 * * 1-6'  # Lun-Sab alle 07:00 UTC
  workflow_dispatch:          # Permette run manuale dalla UI GitHub

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize database if not exists
        run: python db/database.py
        env:
          DB_PATH: pharma_algo.db

      - name: Run daily monitor
        run: python modules/monitor.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          DB_PATH: pharma_algo.db

      - name: Generate updated report
        run: python modules/report.py
        env:
          DB_PATH: pharma_algo.db

      - name: Commit updated report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add pharma_algo.db web/index.html
          git diff --staged --quiet || git commit -m "Daily monitor - $(date +'%Y-%m-%d')"
          git push
